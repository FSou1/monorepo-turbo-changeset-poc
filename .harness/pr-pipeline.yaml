pipeline:
  name: monorepo-pr
  identifier: monorepo_pr
  # Replace these with your Harness project/org identifiers.
  projectIdentifier: monorepoturbochangesetpoc
  orgIdentifier: default
  properties:
    ci:
      codebase:
        # Replace with your Git connector + repo name (or use <+input>).
        connectorRef: account.Github_OAuth_1777260289768
        repoName: FSou1/monorepo-turbo-changeset-poc
        build: <+input>
  stages:
    - stage:
        name: Verify changed packages
        identifier: verify_changed
        type: CI
        spec:
          cloneCodebase: true
          # Harness Cloud infra: no Kubernetes/Docker connector needed.
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          # Cache the pnpm store + turbo cache across runs to speed up CI.
          caching:
            enabled: true
            paths:
              - .turbo
              - /root/.local/share/pnpm/store
          execution:
            steps:
              # Harness Cloud defaults to Node 18; align with engines >=20 so
              # the same toolchain is used as the release pipeline.
              - step:
                  type: Action
                  name: Setup Node 20
                  identifier: setup_node
                  spec:
                    uses: actions/setup-node@v4
                    with:
                      node-version: "20"
              - step:
                  name: Install
                  identifier: install
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      corepack enable
                      corepack prepare pnpm@9.12.3 --activate
                      pnpm install --frozen-lockfile
              - step:
                  name: Build and test affected
                  identifier: build_test_affected
                  type: Run
                  spec:
                    shell: Sh
                    command: |
                      # Make the PR's target branch available locally so Turbo
                      # can diff against it and select only changed packages
                      # (plus dependents, e.g. package-c -> package-b -> package-a).
                      git fetch --no-tags origin <+codebase.targetBranch>
                      # Turbo has no --affected-base flag; the comparison base
                      # is provided via the TURBO_SCM_BASE env var.
                      export TURBO_SCM_BASE="origin/<+codebase.targetBranch>"
                      pnpm exec turbo run build test --affected
